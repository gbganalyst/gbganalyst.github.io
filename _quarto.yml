project:
  type: website
  output-dir: docs
  preview:
    port: 4200
  resources:
    - "images/**"
    - "!blog/money-market/*"
#    - "sitemap.xml"
#    - "_redirects"
#    - "speaking/pdf/**"
  render:
    - "*.qmd"
    - "!blog/money-market/*"
execute:
  freeze: auto

website:
  title: "Ezekiel Ogundepo"
  llms-txt: true # making your content more accessible to LLMS and AI-powered tools
  site-url: "gbganalyst.github.io"
  navbar:
    logo: /images/logo.png
    background: secondary
    search: true
    left:
      - text: Home
        href: index.qmd
      - text: CV
        href: cv/index.qmd
      - text: Blog
        href: blog/index.qmd
      - text: "Resources"
        menu:
          - text: "bulkreadr R Package"
            href: https://gbganalyst.github.io/bulkreadr
          - text: "forstringr R Package"
            href: https://gbganalyst.github.io/forstringr
          - text: "Data Science Training"
            href: https://tauniversity.github.io/tau-ds-webpage

    right:
      - icon: twitter
        text: "X"
        aria-label: "X"
        href: https://twitter.com/gbganalyst
      - icon: youtube
        text: "YouTube"
        aria-label: "YouTube"
        href: https://www.youtube.com/@gbganalytics
      - icon: github
        text: "GitHub"
        aria-label: "GitHub"
        href: https://github.com/gbganalyst
      - icon: linkedin
        text: "LinkedIn"
        aria-label: "LinkedIn"
        href: https://www.linkedin.com/in/gbganalyst/
      - icon: mortarboard-fill
        text: "Google Scholar"
        aria-label: "Google Scholar"
        href: https://scholar.google.com/citations?user=4Lzit9EAAAAJ
      - icon: envelope
        text: "Email"
        aria-label: "Email"
        href: "mailto:gbganalyst@gmail.com"

#  page-footer: 
#    border: true
#    background: dark
#    left: "Copyright 2024, Ezekiel Ogundepo" 
#    right: 
#      - icon: stopwatch
#        text: " Updated on August 12, 2024"

  page-footer: 
    left: |
      <span class="faux-block">{{< fa brands creative-commons >}} 2026 Ezekiel Ogundepo</span>
#     <span class="faux-block"><a href="https://github.com/gbganalyst/gbganalyst.github.io">{{< fa brands github >}} Source Code</a></span>
    center: |
     <span class="faux-block">{{< fa brands orcid >}} <strong>ORCID</strong> [0000-0003-3974-2733](https://orcid.org/0000-0003-3974-2733)</span>
#      Adapted with appreciation from <a href="https://marvinschmitt.com">Marvin Schmitt's website</a>
    right: |
      <span class="faux-block"> Built with {{< fa brands r-project >}} and <a href="https://quarto.org/">Quarto</a></span>

  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

# Social Metadata
  favicon: images/logo.png
  twitter-card: 
    creator: "@gbganalyst"
    image: "/images/website_thumbnail.png"
    
  open-graph: 
    image: "/images/website_thumbnail.png"
    locale: en_US
# Announcement Bar
  announcement:
    icon: megaphone
    dismissable: true
    content: "Our customised [Data Science](https://tauniversity.github.io/tau-ds-webpage) training, designed exclusively for graduating students of Thomas Adewumi University, is currently underway."
    type: info
    position: above-navbar
    
